apiVersion: v1
kind: deployment
metadata:
  name: backend-deployment
  namespace: three-tier-application
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: garry12132/production-level-application-backend
          ports:
            - containerPort: 8080