apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: three-tier-application
type: Opaque
stringData:
  POSTGRES_DB: "crumbco"
  POSTGRES_USER: "crumbco"
  POSTGRES_PASSWORD: "root"     // I've set the username to root. You can change it if needed, but the password should be strong.
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: three-tier-application
type: Opaque
stringData:
  DATABASE_URL: "postgres://crumbco:root@postgres-service:5432/crumbco?sslmode=disable" // same as this side aslo....
