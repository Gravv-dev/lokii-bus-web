apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: three-tier-application
type: Opaque
stringData:
  POSTGRES_DB: "crumbco"
  POSTGRES_USER: "crumbco"
  POSTGRES_PASSWORD: "root"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: three-tier-application
type: Opaque
stringData:
  DATABASE_URL: "postgres://crumbco:root@postgres-service:5432/crumbco?sslmode=disable"
