apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: three-tier-application
data:
  CORS_ALLOWED_ORIGINS: "http://localhost:3000" # If you're using an EC2 instance, use its public IP address instead of localhost when you want to access your website from outside the instance.

    #If you're running everything on your local system and not using EC2, then localhost is fine.

    #However, if you want to access your website through a domain name or make it publicly accessible on the internet, you'll need to configure the appropriate public IP address, domain name, and# network settings.
